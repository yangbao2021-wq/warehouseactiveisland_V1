        body {
            font-family: 'Noto Sans TC', sans-serif;
            overflow: hidden;
            background-color: #0d1117;

            backdrop-filter: blur(16px);

            border: 1px solid rgba(255, 255, 255, 0.12);

        .island-pin {
            position: absolute;
            transform: translate(-50%, -100%);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

            transform: translate(-50%, -110%) scale(1.08);

        ::-webkit-scrollbar-thumb:hover { background: rgba(245, 158, 11, 0.9); }

            <!-- Progress Indicator -->

                <!-- SOP -->

                <!-- Quiz -->

    <!-- Certificate Modal -->
    <div id="cert-modal" class="fixed inset-0 z-40 bg-slate-950/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">

                <div class="flex justify-between items-center border-b border-slate-800 pb-2.5">

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed top-24 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // --- Web Audio Synthesizer ---
        const AudioFX = {
            ctx: null,
            muted: false,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            },
            playClick() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            },
            playSuccess() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.setValueAtTime(659, now + 0.08);
                osc.frequency.setValueAtTime(783, now + 0.16);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.35);
            },
            playFail() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(150, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.3);
            }
        };

        document.getElementById('sound-btn').addEventListener('click', () => {
            AudioFX.muted = !AudioFX.muted;
            const btn = document.getElementById('sound-btn');
            btn.innerHTML = AudioFX.muted ? '<i class="fa-solid fa-volume-xmark text-slate-500 text-xs"></i>' : '<i class="fa-solid fa-volume-high text-yellow-400 text-xs"></i>';
            showToast(AudioFX.muted ? '靜音模式' : '音效已開啟');
        });

        // --- Data Model for Safety Zones ---
        const ZONES = [
            {
                id: 'zone-1',
                title: '1. 堆高機動線與視線盲區',
                color: '#FF5722',
                isoPos: { x: 0, y: 0 },

                sop: [
                    { title: '路口停看聽鳴笛', desc: '行經通道交叉口、出入口必須減速降至 5km/h 以下並鳴笛。' },
                    { title: '視線受阻採倒車行駛', desc: '載物高度超過擋貨架影響前瞻視線時，一律採取倒車後退駕駛。' },
                    { title: '安全警戒區 3 公尺', desc: '堆高機叉舉貨物作業時，方圓 3 公尺內嚴禁任何人員逗留。' }
                ],
                quiz: {
                    q: '當堆高機載運高大棧板、貨物已完全遮蔽駕駛前方視線時，正確的操作方式是？',
                    options: [
                        '探出頭邊看邊往前行駛',
                        '改採取倒車方向後退行駛，並確認後方防護',
                        '加速衝過盲區路口',
                        '持續大聲叫喊讓周遭人員避讓'
                    ],
                    answer: 1,
                    explain: '視線受阻時一律採取倒車駕駛，並搭配倒車警報器提示周遭人員！'
                }
            },
            {
                id: 'zone-2',
                title: '2. 電動搬運車與板車安全',
                color: '#00E5FF',
                isoPos: { x: 220, y: -110 },
                hazards: '車輪壓傷腳趾、緊急煞車導致托盤貨物甩飛坍塌、控制拉桿夾傷手部。',
                sop: [
                    { title: '穿著鋼頭防砸鞋', desc: '進入作業區全程佩戴鋼頭防砸安全鞋，預防車輪壓傷足部。' },
                    { title: '操作手把保持安全距離', desc: '控制轉向拉桿時手部位於防護托內，防止擠壓牆面。' },
                    { title: '轉彎前提前減速', desc: '轉彎時必須預留尾部甩尾空間，嚴禁高速陡轉。' }
                ],
                quiz: {
                    q: '操作電動板車行經狹窄通道轉彎時，下列哪一項做法是正確的？',
                    options: [
                        '單手操作拉桿並甩尾轉彎',
                        '提前減速，確認周遭無人員並留出轉彎離隙',
                        '邊看手機邊控制速度',
                        '持續按住最高速按鈕轉彎'
                    ],
                    answer: 1,
                    explain: '電動板車車尾轉彎有甩尾夾傷風險，必須提前減速並注意離隙！'
                }
            },
            {
                id: 'zone-3',
                title: '3. 高層架防墜物與綑綁',
                color: '#EF4444',
                isoPos: { x: -220, y: -110 },
                hazards: '頂層散裝物品地震落物砸傷、破損棧板上架斷裂跌落、打包膜未裹緊。',
                sop: [
                    { title: '進入高架區佩戴安全帽', desc: '進入高層架區必須戴緊安全帽並扣好顎帶。' },

                ],
                quiz: {
                    q: '高層架物品在安排上架作業前，最重要的防墜檢查項目是？',
                    options: [

                        '直接快速上架無需檢查',

                    ],
                    answer: 0,
                    explain: '破損棧板承重失效與包覆不實是高空落物主因，上架前必須落實 Inspection！'
                }
            },
            {
                id: 'zone-4',
                title: '4. 包裝作業與氣動釘槍',
                color: '#FFB800',
                isoPos: { x: 220, y: 110 },
                hazards: '誤扣 trigger 導致鋼釘射入手部、鋼釘反彈傷眼、氣壓管線絆倒。',
                sop: [
                    { title: '佩戴防護眼鏡', desc: '操作釘槍作業時必須佩戴抗衝擊安全護目鏡。' },
                    { title: '離場即拔除氣壓源', desc: '清理卡釘或暫離工作台時，必須先拔掉快速氣壓接頭。' },
                    { title: '保持 10cm 手部離隙', desc: '壓緊木板時手部離擊發點至少 10 公分以上，嚴禁對人。' }
                ],
                quiz: {
                    q: '當氣動釘槍發生「卡釘」故障需要排除時，應優先執行的第一步是？',
                    options: [
                        '拿鐵鎚敲擊槍頭',
                        '立刻拔除氣壓源快速接頭',
                        '扣住扳機用手指去拔釘',
                        '轉交給隔壁同仁操作'
                    ],
                    answer: 1,
                    explain: '排除卡釘前務必先切斷氣壓源，防止誤觸導致鋼釘再次擊發！'
                }
            },
            {
                id: 'zone-5',
                title: '5. 木箱拆解與鐵釘防刺傷',
                color: '#D97706',
                isoPos: { x: -220, y: 110 },
                hazards: '拆箱帶釘木板隨地拋擲刺傷腳底、鐵釘劃傷手掌、木屑飛濺。',
                sop: [
                    { title: '拆箱即拔釘/敲平', desc: '拆解木箱板材後，立即將鐵釘拔除或打平，嚴禁露釘隨意拋擲。' },
                    { title: '防穿刺鞋與防割手套', desc: '拆箱區人員必須穿著防穿刺鋼板鞋底安全鞋及 level 5 防割手套。' },
                    { title: '廢木材釘朝下堆疊', desc: '廢棄木板集中放置於專用回收區，且一律釘朝下。' }
                ],
                quiz: {
                    q: '拆解進口木箱後，發現板材上有外露的長鐵釘，正確處理方式是？',
                    options: [
                        '隨手扔在地上等清潔員處理',
                        '釘朝上擺放提醒大家注意',
                        '立即將鐵釘打平或拔除，並釘朝下整齊堆疊',
                        '用腳踩一下即可'
                    ],
                    answer: 2,
                    explain: '露釘是倉儲足部刺傷元兇，「拆箱即拔釘、板材釘朝下」是鐵律！'
                }
            },
            {
                id: 'zone-6',
                title: '6. 化學品洩漏與急救應變',
                color: '#9C27B0',
                isoPos: { x: 0, y: -220 },
                hazards: '腐蝕液體潑濺皮膚與眼睛、吸入有害氣體、洩漏擴散污染環境。',
                sop: [
                    { title: '洩漏應變 4 步驟', desc: '1.疏散人員 -> 2.穿戴防化 PPE -> 3.使用吸液棉圍堵 -> 4.通報主管。' },
                    { title: '緊急洗眼沖洗 15 分鐘', desc: '若化学液潑濺眼睛，立即至緊急洗眼站連續沖洗 15 分鐘以上。' },
                    { title: '參照 SDS 安全資料表', desc: '存放區隨時可查閱 SDS，明確吸收劑種類與急救措施。' }
                ],
                quiz: {
                    q: '現場化學桶不幸翻倒洩漏時，第一時間應採取的正確應變順序為？',
                    options: [
                        '用拖把擦掉 -> 繼續工作',
                        '疏散周遭人員 -> 穿戴抗化 PPE -> 用吸液棉圍堵 -> 通報主管',
                        '用手去擦拭 -> 跑去洗手',
                        '假裝沒看到離開現場'
                    ],
                    answer: 1,
                    explain: '洩漏應變以人身安全為第一，先疏散與佩戴防護具，再進行吸液圍堵！'
                }
            }
        ];

        let clearedZones = new Set();
        let timeMode = 'day';

        // Sky & Theme Presets
        const THEMES = {
            day: { bg: '#0f172a', grid: 'rgba(255,255,255,0.05)', top: '#334155', side1: '#1e293b', side2: '#0f172a' },
            sunset: { bg: '#1a0c1a', grid: 'rgba(255,150,100,0.06)', top: '#4a2c3a', side1: '#2e1824', side2: '#180a12' },
            night: { bg: '#070a12', grid: 'rgba(0,229,255,0.08)', top: '#1e1b4b', side1: '#0f172a', side2: '#020617' }
        };

        // --- Isometric Canvas Engine ---
        const canvas = document.getElementById('world-canvas');
        const ctx = canvas.getContext('2d');
        const pinsContainer = document.getElementById('pins-layer');

        let cameraOffset = { x: 0, y: 0 };
        let isDragging = false;
        let startDrag = { x: 0, y: 0 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cameraOffset.x = canvas.width / 2;
            cameraOffset.y = canvas.height / 2 + 30;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Drag to Pan Controls
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startDrag = { x: e.clientX - cameraOffset.x, y: e.clientY - cameraOffset.y };
        });
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                cameraOffset.x = e.clientX - startDrag.x;
                cameraOffset.y = e.clientY - startDrag.y;
            }
        });
        window.addEventListener('mouseup', () => isDragging = false);

        // Workers & AGVs Dynamic State
        let workers = ZONES.map((z, idx) => ({
            id: idx,
            currentZoneIdx: idx,
            targetZoneIdx: (idx + 1) % ZONES.length,
            progress: Math.random(),
            state: 'WALKING', // WALKING or WORKING
            workTimer: 0
        }));

        let agvs = [
            { currentIdx: 0, targetIdx: 1, progress: 0 },
            { currentIdx: 3, targetIdx: 4, progress: 0.5 }
        ];

        // Draw 3D Hexagonal Isometric Island
        function drawHexIsland(cx, cy, radius, colorHex, isHovered, zoneData) {
            const h = 50; // Thickness
            const theme = THEMES[timeMode];

            // Top Face Vertices
            const topPoints = [];
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i - Math.PI / 6;
                topPoints.push({
                    x: cx + radius * Math.cos(angle),
                    y: cy + (radius * Math.sin(angle)) * 0.5
                });
            }

            // Draw 3D Sides
            ctx.fillStyle = theme.side1;
            ctx.beginPath();
            ctx.moveTo(topPoints[1].x, topPoints[1].y);
            ctx.lineTo(topPoints[2].x, topPoints[2].y);
            ctx.lineTo(topPoints[2].x, topPoints[2].y + h);
            ctx.lineTo(topPoints[1].x, topPoints[1].y + h);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = theme.side2;
            ctx.beginPath();
            ctx.moveTo(topPoints[2].x, topPoints[2].y);
            ctx.lineTo(topPoints[3].x, topPoints[3].y);
            ctx.lineTo(topPoints[3].x, topPoints[3].y + h);
            ctx.lineTo(topPoints[2].x, topPoints[2].y + h);
            ctx.closePath();
            ctx.fill();

            // Top Surface
            ctx.fillStyle = isHovered ? '#38bdf8' : theme.top;
            ctx.beginPath();
            ctx.moveTo(topPoints[0].x, topPoints[0].y);
            for (let i = 1; i < 6; i++) ctx.lineTo(topPoints[i].x, topPoints[i].y);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = colorHex;
            ctx.lineWidth = isHovered ? 4 : 2;
            ctx.stroke();

            // Render Props inside Islands
            drawIslandProps(cx, cy, zoneData);
        }

        // Mini Props inside Islands
        function drawIslandProps(cx, cy, zone) {
            ctx.save();
            if (zone.id === 'zone-1') {
                // Forklift
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(cx - 15, cy - 15, 30, 20);
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(cx - 18, cy - 8, 8, 12);
            } else if (zone.id === 'zone-2') {
                // Pallet Jack
                ctx.fillStyle = '#0284c7';
                ctx.fillRect(cx - 12, cy - 10, 24, 15);
            } else if (zone.id === 'zone-3') {
                // High Racks
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(cx - 20, cy - 25, 6, 35);
                ctx.fillRect(cx + 14, cy - 25, 6, 35);
                ctx.fillStyle = '#d97706';
                ctx.fillRect(cx - 14, cy - 18, 28, 8);
            } else if (zone.id === 'zone-4') {
                // Workbench & Nailer
                ctx.fillStyle = '#78350f';
                ctx.fillRect(cx - 18, cy - 10, 36, 12);
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(cx - 5, cy - 16, 10, 6);
            } else if (zone.id === 'zone-5') {
                // Wooden Box
                ctx.fillStyle = '#d97706';
                ctx.fillRect(cx - 14, cy - 14, 28, 20);
            } else if (zone.id === 'zone-6') {
                // Hazmat Spill
                ctx.fillStyle = '#a855f7';
                ctx.beginPath();
                ctx.arc(cx, cy, 14, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // Draw Walking Worker Figure
        function drawWorker(x, y, isWorking) {
            ctx.save();
            ctx.translate(x, y);

            // Legs Animation
            const legSwing = isWorking ? 0 : Math.sin(Date.now() * 0.01) * 5;
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-3, 0); ctx.lineTo(-3 + legSwing, 10);
            ctx.moveTo(3, 0); ctx.lineTo(3 - legSwing, 10);
            ctx.stroke();

            // Vest Torso
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(-6, -12, 12, 12);

            // Safety Helmet
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(0, -16, 6, Math.PI, 0);
            ctx.fill();

            ctx.restore();
        }

        // Render Connecting Bridges
        function drawBridges() {
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
            ctx.lineWidth = 6;
            ctx.setLineDash([8, 8]);

            for (let i = 0; i < ZONES.length; i++) {
                const nextIdx = (i + 1) % ZONES.length;
                const p1 = { x: cameraOffset.x + ZONES[i].isoPos.x, y: cameraOffset.y + ZONES[i].isoPos.y };
                const p2 = { x: cameraOffset.x + ZONES[nextIdx].isoPos.x, y: cameraOffset.y + ZONES[nextIdx].isoPos.y };

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }
            ctx.setLineDash([]);
        }

        // Main Render Loop
        function render() {
            const theme = THEMES[timeMode];
            ctx.fillStyle = theme.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawBridges();

            // Render Islands
            ZONES.forEach((zone) => {
                const screenX = cameraOffset.x + zone.isoPos.x;
                const screenY = cameraOffset.y + zone.isoPos.y;
                drawHexIsland(screenX, screenY, 80, zone.color, false, zone);
            });

            // Update & Render Moving Workers
            workers.forEach(w => {
                const z1 = ZONES[w.currentZoneIdx];
                const z2 = ZONES[w.targetZoneIdx];

                if (w.state === 'WALKING') {
                    w.progress += 0.003;
                    if (w.progress >= 1) {
                        w.progress = 0;
                        w.state = 'WORKING';
                        w.workTimer = 180; // 3 seconds
                    }
                } else {
                    w.workTimer--;
                    if (w.workTimer <= 0) {
                        w.currentZoneIdx = w.targetZoneIdx;
                        w.targetZoneIdx = (w.targetZoneIdx + 1) % ZONES.length;
                        w.state = 'WALKING';
                    }
                }

                const currX = cameraOffset.x + z1.isoPos.x + (z2.isoPos.x - z1.isoPos.x) * w.progress;
                const currY = cameraOffset.y + z1.isoPos.y + (z2.isoPos.y - z1.isoPos.y) * w.progress;

                drawWorker(currX, currY, w.state === 'WORKING');
            });

            updateOverlayPins();
            requestAnimationFrame(render);
        }

        // Dynamic Overlay HTML Pins Syncing
        function createOverlayPins() {
            pinsContainer.innerHTML = '';
            ZONES.forEach((zone) => {
                const pin = document.createElement('div');
                pin.className = 'island-pin pointer-events-auto';
                pin.setAttribute('data-id', zone.id);
                pin.onclick = () => openZoneDrawer(zone);

                const isCleared = clearedZones.has(zone.id);
                pin.innerHTML = `
                    <div class="glass-panel px-3 py-2 rounded-2xl flex items-center gap-2.5 shadow-2xl border border-white/20">
                        <div class="w-3 h-3 rounded-full animate-ping" style="background-color: ${zone.color}"></div>
                        <div class="text-left">
                            <p class="text-xs font-black text-white whitespace-nowrap">${zone.title}</p>
                            <span class="status-badge text-[10px] font-bold px-1.5 py-0.2 rounded ${isCleared ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-300'}">
                                ${isCleared ? 'PASSED ✅' : '未考驗 🔴'}
                            </span>
                        </div>
                    </div>
                `;
                pinsContainer.appendChild(pin);
            });
        }

        function updateOverlayPins() {
            const pins = pinsContainer.querySelectorAll('.island-pin');
            pins.forEach(pin => {
                const id = pin.getAttribute('data-id');
                const zone = ZONES.find(z => z.id === id);
                if (zone) {
                    const screenX = cameraOffset.x + zone.isoPos.x;
                    const screenY = cameraOffset.y + zone.isoPos.y - 40;
                    pin.style.left = `${screenX}px`;
                    pin.style.top = `${screenY}px`;
                }
            });
        }

        // Drawer Logic
        const sideDrawer = document.getElementById('side-drawer');
        function openZoneDrawer(zone) {
            AudioFX.playClick();
            document.getElementById('drawer-title').innerText = zone.title;
            document.getElementById('drawer-hazards').innerText = zone.hazards;

            const isCleared = clearedZones.has(zone.id);
            const statusTag = document.getElementById('drawer-status-tag');
            statusTag.className = isCleared ? "text-xs font-black text-emerald-400 flex items-center gap-1" : "text-xs font-bold text-amber-400 flex items-center gap-1";
            statusTag.innerHTML = isCleared ? `<i class="fa-solid fa-circle-check"></i> 已通關認證` : `<i class="fa-regular fa-clock"></i> 尚待考驗認證`;

            // SOP
            const sopContainer = document.getElementById('drawer-sop-list');
            sopContainer.innerHTML = '';
            zone.sop.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = "p-3 rounded-xl bg-slate-900/80 border border-slate-800";
                div.innerHTML = `
                    <p class="font-bold text-xs text-white flex items-center gap-2">
                        <span class="w-4 h-4 rounded-full bg-yellow-400 text-slate-950 text-[10px] flex items-center justify-center font-black">${idx + 1}</span>
                        ${item.title}
                    </p>
                    <p class="text-[11px] text-slate-400 mt-1 pl-6 leading-relaxed">${item.desc}</p>
                `;
                sopContainer.appendChild(div);
            });

            // Quiz
            document.getElementById('quiz-question').innerText = zone.quiz.q;
            const optionsContainer = document.getElementById('quiz-options');
            const feedback = document.getElementById('quiz-feedback');
            feedback.className = "hidden text-xs p-3 rounded-xl font-bold leading-relaxed";

            optionsContainer.innerHTML = '';
            zone.quiz.options.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-xs text-slate-200 font-medium transition border border-slate-800 flex items-center justify-between";
                btn.innerHTML = `<span>${opt}</span><i class="fa-regular fa-circle text-slate-600"></i>`;
                btn.onclick = () => submitQuiz(zone, optIdx, feedback);
                optionsContainer.appendChild(btn);
            });

            sideDrawer.classList.remove('translate-x-full');
        }

        function submitQuiz(zone, selectedIdx, feedbackEl) {
            if (selectedIdx === zone.quiz.answer) {
                AudioFX.playSuccess();
                feedbackEl.className = "block text-xs p-3 rounded-xl font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                feedbackEl.innerText = `🎉 答對了！ ${zone.quiz.explain}`;

                clearedZones.add(zone.id);
                updateProgress();
                createOverlayPins();
            } else {
                AudioFX.playFail();
                feedbackEl.className = "block text-xs p-3 rounded-xl font-bold bg-red-500/20 text-red-300 border border-red-500/30";
                feedbackEl.innerText = `❌ 回答錯誤！請再研讀 SOP 防線指引後重試。`;
            }
        }

        function updateProgress() {
            const pct = Math.round((clearedZones.size / ZONES.length) * 100);
            document.getElementById('global-progress-num').innerText = `${pct}%`;
            document.getElementById('global-progress-bar').style.width = `${pct}%`;
            if (clearedZones.size === ZONES.length) showToast('🏆 恭喜精通全庫區 6 大工安防線，可領取結業證書！');
        }

        document.getElementById('close-drawer-btn').addEventListener('click', () => sideDrawer.classList.add('translate-x-full'));

        // Theme Switcher
        document.querySelectorAll('.time-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                AudioFX.playClick();
                document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('bg-yellow-400', 'text-slate-950'));
                e.currentTarget.classList.add('bg-yellow-400', 'text-slate-950');
                timeMode = e.currentTarget.getAttribute('data-time');
            });
        });

        // Certificate Modal
        const certModal = document.getElementById('cert-modal');
        document.getElementById('open-cert-btn').addEventListener('click', () => {
            AudioFX.playClick();
            document.getElementById('cert-completion-status').innerText = `${clearedZones.size} / ${ZONES.length} 島嶼全數精通`;
            certModal.classList.remove('hidden');
            setTimeout(() => certModal.classList.remove('opacity-0'), 10);
        });
        document.getElementById('close-cert-modal').addEventListener('click', () => {
            certModal.classList.add('opacity-0');
            setTimeout(() => certModal.classList.add('hidden'), 300);
        });
        document.getElementById('print-cert-btn').addEventListener('click', () => window.print());

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'glass-panel px-4 py-3 rounded-2xl text-xs font-bold text-white border border-yellow-400/40 shadow-xl';
            toast.innerHTML = `<i class="fa-solid fa-bell text-yellow-400 mr-2"></i>${msg}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        createOverlayPins();
        render();
    </script>
</body>
</html>
